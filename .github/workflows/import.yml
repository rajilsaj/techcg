name: Automatic import

# Imports new articles from the sources set up in Admin › Importation, every 30 minutes.
# The site only re-reads sources that are due (30 min; 6 h for Google News searches).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: automatic-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run the import on techcg.vercel.app
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o result.json -w "%{http_code}" --max-time 310 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://techcg.vercel.app/api/cron/import?trigger=github")
          echo "HTTP $status"
          cat result.json; echo
          test "$status" = "200"
