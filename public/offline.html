<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hors ligne · Tech.cg</title>
<style>
  :root { --bg: #ffffff; --text: #000000; --muted: #666666; --accent: #0066ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0d0d; --text: #ffffff; --muted: #a0a0a0; } }
  :root[data-theme="dark"] { --bg: #0d0d0d; --text: #ffffff; --muted: #a0a0a0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text); text-align: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .mark {
    display: grid; place-items: center; width: 64px; height: 64px; border-radius: 16px;
    background: var(--accent); color: #fff; font-size: 30px; font-weight: 700;
    box-shadow: 0 10px 24px rgba(0, 102, 255, 0.3);
  }
  h1 { font-size: 24px; }
  p { max-width: 22rem; font-size: 14px; line-height: 1.5; color: var(--muted); }
  button {
    border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600;
  }
  a { color: var(--accent); font-size: 14px; text-decoration: none; }
</style>
<script>
  // Same theme as the site: the visitor's choice, else the device setting.
  try { var c = localStorage.getItem("theme-choice"); if (c) document.documentElement.setAttribute("data-theme", c); } catch (e) {}
  // Back online: load the page that was asked for.
  window.addEventListener("online", function () { location.reload(); });
</script>
</head>
<body>
  <div class="mark" aria-hidden="true">T</div>
  <h1>Vous êtes hors ligne</h1>
  <p>Cette page n'est pas disponible sans connexion. Les articles déjà ouverts restent lisibles ; la page se recharge dès que le réseau revient.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <a href="/">Retour à l'accueil</a>
</body>
</html>
